# Single source of configuration. Paths are relative to the repository root.

[corpus]
# Supabase docs (Apache-2.0, see data/fixture/NOTICE.md), pinned to one commit.
repo = "supabase/supabase"
sha = "311e2c721c1e3dc613cb5161f101eaf68ebe5b27"
docs_root = "apps/docs/content/guides"
base_url = "https://supabase.com/docs/guides"
# fnmatch patterns on paths relative to docs_root ("*" also matches "/").
include = [
  "database.mdx", "database/*",
  "auth.mdx", "auth/*",
  "storage.mdx", "storage/*",
  "functions.mdx", "functions/*",
]
# Provider-by-provider login pages, framework quickstarts and example apps are
# near-duplicates of each other; they are excluded to keep the corpus focused.
exclude = ["auth/social-sign-in/*", "auth/quickstarts/*", "functions/examples/*"]
cache_dir = ".cache/corpus"
fixture_dir = "data/fixture/pages"

[chunking]
max_words = 300
overlap_words = 50
min_words = 40

[embedding]
model = "BAAI/bge-small-en-v1.5"
dim = 384
# BGE v1.5 recommends this instruction for short queries against passages.
query_prefix = "Represent this sentence for searching relevant passages: "

[retrieval]
# The variant we ship (MCP/CLI default) and gate on with absolute floors.
# Chosen from the measured results: see README "Results".
default_mode = "vector"
candidates = 50       # per-retriever candidate pool fed to RRF / reranker
rrf_k = 60            # standard RRF constant (Cormack et al., 2009)
hnsw_ef_search = 100
reranker_model = "Xenova/ms-marco-MiniLM-L-6-v2"
rerank_candidates = 30

[eval]
golden = "data/golden/golden.jsonl"
ks = [1, 3, 5, 10]
variants = ["fts", "vector", "hybrid", "hybrid_rerank"]
reports_dir = "results"
baselines_dir = "evals/baselines"
# Max allowed drop vs the committed baseline, per gated metric (absolute).
tolerance = 0.03
gated_metrics = ["recall@5", "recall@10", "mrr", "ndcg@10"]

# Absolute floors for retrieval.default_mode, per corpus. Set a few points below
# the first measured run (fixture: 44 answerable questions, full: 64), so they
# catch real breakage, not one question flipping.
[eval.thresholds.fixture]
"recall@5" = 0.90
"recall@10" = 0.95
"mrr" = 0.85
"ndcg@10" = 0.88

[eval.thresholds.full]
"recall@5" = 0.85
"recall@10" = 0.90
"mrr" = 0.78
"ndcg@10" = 0.80

[answers]
model = "claude-sonnet-5-5"
judge_model = "claude-sonnet-5-5"
k = 6  # chunks retrieved with retrieval.default_mode
max_tokens = 700
# USD per million tokens. Defaults are placeholders: set them to the current
# list price of the model you use before trusting the cost column.
input_price_per_mtok = 3.0
output_price_per_mtok = 15.0
